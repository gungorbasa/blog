baseURL = "https://gungorbasa.com/"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 26
title = "Gungor Basa"

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:contentbasename"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[sitemap]
  changeFreq = "weekly"
  priority = 0.5

[privacy]
  [privacy.youtube]
    privacyEnhanced = true
